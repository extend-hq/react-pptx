[package]
name = "react-pptx-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "packages/wasm/src/bridge.rs"

[dependencies]
rust-pptx-wasm = "=0.4.1"

[dev-dependencies]
rust-pptx = "=0.4.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
