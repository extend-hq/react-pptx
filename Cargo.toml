[package]
name = "react-pptx-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "packages/wasm/src/bridge.rs"

[dependencies]
rust-pptx-wasm = { git = "https://github.com/extend-hq/rust-office.git", rev = "7555683a8e690baf37fe3442d9376b43750276a1" }

[dev-dependencies]
rust-pptx = { git = "https://github.com/extend-hq/rust-office.git", rev = "7555683a8e690baf37fe3442d9376b43750276a1" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
